name: GenTV Remote Delivery

on:
  push:
    branches: [feat/remote-zh-tw-only-run61]
    paths:
      - 'phone/**'
      - 'framework/**'
      - 'launcher/**'
      - 'tools/**'
      - 'licenses/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/build-remote-delivery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-remote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        id: jdk17
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Java toolchains
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21

      - name: Build and test GenTV Remote
        working-directory: phone
        env:
          GENTV_HOME_JAVA_HOME: ${{ steps.jdk17.outputs.path }}
        run: ./gradlew --no-daemon :core:test :adb:test :tv-care:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find phone/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p dist
          cp "$APK" dist/GenTV-Remote-debug.apk
          echo "APK_PATH=dist/GenTV-Remote-debug.apk" >> "$GITHUB_ENV"

      - name: Package complete repository source
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::12}"
          zip -qr "dist/GenTV-Remote-source-${SHORT_SHA}.zip" . \
            -x '.git/*' '*/.git/*' '*/.gradle/*' '*/build/*' '*/.idea/*' \
               '*/local.properties' '*/keys/signing.properties' '*/keys/*.jks' '*/keys/*.keystore' \
               'dist/*'
          test -s "dist/GenTV-Remote-source-${SHORT_SHA}.zip"

      - name: Upload installable APK and source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GenTV-Remote-Delivery-${{ github.sha }}
          path: |
            dist/GenTV-Remote-debug.apk
            dist/GenTV-Remote-source-*.zip
          if-no-files-found: error
          retention-days: 30
