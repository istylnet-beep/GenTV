name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/check_branding.py
      - run: python3 tools/check_repository.py
      - run: python3 -m unittest discover -s server/wallpaper -p 'test_*.py'
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: python3 -m unittest discover -s skills/gentv-tv-care/scripts -p 'test_*.py'

  tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
        working-directory: launcher

  phone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: jdk17
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21
      - run: ./gradlew --no-daemon :core:test :adb:test :tv-care:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
        working-directory: phone
        env:
          GENTV_HOME_JAVA_HOME: ${{ steps.jdk17.outputs.path }}
      - name: Stage GenTV Remote APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find phone/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p dist
          cp "$APK" dist/GenTV-Remote-debug.apk
      - name: Package complete source ZIP
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::12}"
          zip -qr "dist/GenTV-Remote-source-${SHORT_SHA}.zip" . \
            -x '.git/*' '*/.git/*' '*/.gradle/*' '*/build/*' '*/.idea/*' \
               '*/local.properties' '*/keys/signing.properties' '*/keys/*.jks' '*/keys/*.keystore' \
               'dist/*'
          test -s "dist/GenTV-Remote-source-${SHORT_SHA}.zip"
      - name: Upload APK and complete source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GenTV-Remote-Delivery-${{ github.sha }}
          path: |
            dist/GenTV-Remote-debug.apk
            dist/GenTV-Remote-source-*.zip
          if-no-files-found: error
          retention-days: 30
