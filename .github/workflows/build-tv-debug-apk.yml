name: Build GenTV TV APK (Debug)

on:
  workflow_dispatch:
  push:
    branches:
      - feat/tv-apk-delivery

permissions:
  contents: read

jobs:
  build-tv-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and test TV launcher
        working-directory: launcher
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Generate SHA-256 checksum
        run: |
          cd launcher/app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS.txt

      - name: Upload installable Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gentv-tv-debug-apk
          path: |
            launcher/app/build/outputs/apk/debug/app-debug.apk
            launcher/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
